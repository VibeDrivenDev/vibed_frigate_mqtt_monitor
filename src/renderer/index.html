<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: blob: data:; media-src 'self' blob:; connect-src https: wss: http: ws:; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px -apple-system, "Segoe UI", sans-serif; }
  #grid { display: grid; width: 100vw; height: 100vh; }
  .tile { position: relative; background: #111; overflow: hidden; cursor: pointer; }
  .tile video, .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.hidden { display: none; }
  .actions { position: absolute; left: 8px; top: 8px; display: none; gap: 6px; }
  .tile:hover .actions { display: flex; }
  .actions button { font: inherit; color: #fff; background: rgba(0,0,0,.65); border: 0; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .actions button:hover { background: rgba(0,0,0,.9); }
  .more { position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 4px; color: #fff; background: rgba(0,0,0,.55); display: none; }
  .label { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 4px; color: #fff; background: rgba(0,0,0,.55); text-transform: capitalize; }
  .hold { position: absolute; right: 8px; top: 8px; display: none; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 999px; color: #fff; background: rgba(0,0,0,.55); font-variant-numeric: tabular-nums; }
  .pie { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(#fff var(--p, 0deg), rgba(255,255,255,.25) 0); }
</style>
</head>
<body>
<div id="grid"></div>
<script src="mse.js"></script>
<script src="renderer.js"></script>
</body>
</html>
